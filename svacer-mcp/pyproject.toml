[project]
name = "svacer-mcp-connector"
version = "0.1.0"
description = "MCP Server for Svacer Static Analysis Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-httpserver>=1.1.0",
]

[project.scripts]
svacer-mcp = "svacer_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["svacer_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
